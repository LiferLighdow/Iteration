name: Android Release CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android Build Tools
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;29.0.3"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Get Version Name
      id: get_version
      run: |
        VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Sign Release APK
      if: github.event_name == 'push' && env.SIGNING_KEY != null
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    - name: Prepare Clean Release APKs
      run: |
        VERSION_NAME="${{ steps.get_version.outputs.version }}"
        mkdir -p build/dist
        
        if ls app/build/outputs/apk/release/*-signed.apk 1> /dev/null 2>&1; then
          echo "Processing signed APKs..."
          APKS=(app/build/outputs/apk/release/*-signed.apk)
        else
          echo "Processing standard release APKs..."
          APKS=(app/build/outputs/apk/release/*.apk)
        fi

        for apk in "${APKS[@]}"; do
          filename=$(basename "$apk")
          if [[ "$filename" == *"-aligned"* ]]; then continue; fi
          
          if [[ "$filename" == *"arm64-v8a"* ]]; then
            abi="arm64-v8a"
          elif [[ "$filename" == *"armeabi-v7a"* ]]; then
            abi="armeabi-v7a"
          elif [[ "$filename" == *"x86_64"* ]]; then
            abi="x86_64"
          elif [[ "$filename" == *"universal"* ]]; then
            abi="universal"
          else
            abi=""
          fi

          if [ -n "$abi" ]; then
            cp "$apk" "build/dist/Iteration-v${VERSION_NAME}-${abi}.apk"
          else
            cp "$apk" "build/dist/Iteration-v${VERSION_NAME}.apk"
          fi
        done

        echo "Clean APKs in build/dist:"
        ls -la build/dist/

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Iteration-v${{ steps.get_version.outputs.version }}
        path: build/dist/*.apk

    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        body: |
          Automated release for version ${{ steps.get_version.outputs.version }}.
          
          **Commit Info:**
          - Commit: ${{ github.sha }}
          - Timestamp: ${{ github.event.head_commit.timestamp }}
        files: |
          build/dist/*.apk
        prerelease: false
        generate_release_notes: true
        make_latest: true
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync Code and Tags to Gitea
      run: |
        git push --force --prune https://LiferLighdow:${{ secrets.GITEA_TOKEN }}@git.liferlighdow.duckdns.org/LiferLighdow/Iteration.git HEAD:refs/heads/main --tags

    - name: Mirror Release and APKs to Gitea
      env:
        GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |

        EXISTING_ID=$(curl -s -H "Authorization: token $GITEA_TOKEN" \
          "https://git.liferlighdow.duckdns.org/api/v1/repos/LiferLighdow/Iteration/releases/tags/v$VERSION" | jq -r '.id // empty')
        if [ -n "$EXISTING_ID" ]; then
          curl -s -X DELETE -H "Authorization: token $GITEA_TOKEN" \
            "https://git.liferlighdow.duckdns.org/api/v1/repos/LiferLighdow/Iteration/releases/$EXISTING_ID"
        fi

        CREATE_RES=$(curl -s -X POST "https://git.liferlighdow.duckdns.org/api/v1/repos/LiferLighdow/Iteration/releases" \
          -H "Authorization: token $GITEA_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"tag_name\": \"v$VERSION\",
            \"name\": \"Release v$VERSION\",
            \"body\": \"Synced from GitHub Actions (Commit: ${{ github.sha }})\",
            \"draft\": false,
            \"prerelease\": false
          }")
        RELEASE_ID=$(echo "$CREATE_RES" | jq -r '.id')

        for apk in build/dist/*.apk; do
          filename=$(basename "$apk")
          echo "Uploading $filename to Gitea Release ID $RELEASE_ID..."
          curl -s -X POST "https://git.liferlighdow.duckdns.org/api/v1/repos/LiferLighdow/Iteration/releases/$RELEASE_ID/assets?name=$filename" \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$apk" > /dev/null
        done
